---
- summary: |
    Краткое описание тест-кейса. Например, проверка входа пользователя с существующими логином и паролем
  requirement: |
    Тестируемое требование. Например, при верном вводе логине и пароля пользователь должен войти в систему
  prerequisites: |
    Это условия, которые необходимы для проведения тест-кейса. Они должны быть выполнены еще до запуска тест-кейса.
    Например, открыта страница логина
  test-data: |
    Тестовые данные
    Логин = ilona Пароль = password
  steps:
    - Вводим логин
    - Вводим пароль
    - Нажимаем кнопку «Войти»
  expected-result: |
    Пользователь должен попасть на главную страницу

- summary: |
    Проверка успешного поиска товаров по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites:
    - Пользователь находится на главной странице интернет-магазина
    - В каталоге есть товары, содержащие в названии слово «pepper»
  steps:
    - Кликнуть по строке поиска
    - Ввести в строку поиска ключевое слово "pepper"
  expected-result: |
    Отображается список товаров, соответствующих запросу "pepper"

- summary: |
    Проверка успешной фильтрации товаров по категории
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites:
    - Пользователь находится на главной странице интернет-магазина
    - В системе есть категория "Dior"
  steps:
    - В блоке фильтров поставить флажок напротив категории "Dior"
  expected-result: |
    Отображается список товаров, соответствующих категории "Dior"

- summary: |
    Проверка успешного просмотра каталога товаров
  requirement: |
    Пользователь должен иметь возможность просматривать товары
  prerequisites: |
    - Пользователь находится на главной странице интернет-магазина
  steps:
    - Нажимать на кнопку "Следующая", переходя со страницы на страницу, просматривая каталог
  expected-result: |
    Товары отображаются, у каждого товара видны фото, название, описание, цена, кнопка "В корзину"

- summary: |
    Проверка успешного успешного открытия карточки товара
  requirement: |
    Пользователь должен иметь возможность просматривать подробную информацию о товаре
  prerequisites: |
    - Пользователь находится на любой странице каталога
  steps:
    - Кликнуть по названию или изображению любого товара из каталога
  expected-result: |
    Успешно открывается отдельная страница выбранного товара, отображается вся подробная информация о товаре: фото, название, цена, описание, кнопка "В корзину"

- summary: |
    Проверка успешного добавления товара в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: |
    - Пользователь находится на любой странице каталога
    - В каталоге есть товар с ценой, остаток на складе больше 0
  steps:
    - Нажать на кнопку "В корзину" в карточке товара
  expected-result: |
    Счетчик на иконке корзины в шапке сайта увеличился на 1 **(ВИЗУАЛЬНОЕ ПОДТВЕРЖДЕНИЕ?)**

- summary: |
    Проверка успешного просмотра содержимого корзины
  requirement: |
    Пользователь должен иметь возможность просматривать содержимое корзины
  prerequisites: |
    - Пользователь находится на любой странице каталога
    - В корзину уже добавлен товар, счетчик на иконке корзины больше 0
  steps:
    - Нажать на корзину в шапке сайта
  expected-result: |
    Выполнен переход на страницу корзины, в списке товаров отображается именно добавленный товар, цена, название совпадают с карточкой товара

- summary: |
    Проверка успешного изменения языка интерфейса
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса
  prerequisites: |
    - Пользователь находится на главной странице сайта
    - По умолчанию установлен язык English
    - На сайте доступен альтернативный язык (Spanish)
  steps:
    - Найти в шапке сайта переключатель языков и нажать на него
    - В списке выбрать язык Spanish
    - Проверить основные элементы интерфейса текущей страницы
    - Перейти на любую другую страницу магазина
  expected-result: |
    - Открывается выпадающий список с доступными языками, текущий язык (English) подсвечен как активный
    - Контент на странице должен обновиться, в переключателе языков выделяется выбранный
    - Весь текст переведён на испанский язык, перевод корректен, текст не вылезает за границы элементов
    - Новая страница открывается сразу на испанском языке

