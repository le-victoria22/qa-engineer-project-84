    Успешная очистка корзины после оформления заказа
  requirement: |
    После оформления заказа содержимое корзины должно полностью очищаться, а счётчик товаров в корзине — сбрасываться 
  prerequisites: |
    - Открыта страница корзины
    - В корзину добавлены любые товары
    - Открыт DevTools на вкладке Network 
  test-data: " "
  steps:
    - Шаг 1 Нажать кнопку "Checkout"
    - Шаг 2 При появлении всплывающего сообщения «Order placed successfully» визуально оценить состояние счётчика корзины в шапке и страницы корзины на заднем фоне
    - Шаг 3 Нажать кнопку «Close» внутри всплывающего сообщения
    - Шаг 4 Проверить финальное состояние страницы корзины и счётчика товаров
  expected-result: |
    На шаге 2 счётчик товаров в корзине в шапке сайта сразу сбрасывается, а список товаров на фоне очищается.
    На шаге 4 страница корзины отображается в пустом состоянии, товары в ней полностью отсутствуют.
    При нажатии кнопки "Checkout" в DevTools Network фиксируется уходящий POST-запрос на создание заказа (POST /api/orders) с ответом сервера 200 OK (или 201 Created).

- summary: |
    Проверка предупреждения при закрытии вкладки с товарами в корзине 
  requirement: |
    Если в корзине есть товары, при закрытии вкладки или браузера сайт должен предупреждать о потере данных сессии
  prerequisites: |
    - В корзину добавлены любые товары
  test-data: " "
  steps:
    - Не оформляя заказ, попытаться закрыть вкладку сайта или обновить страницу
  expected-result: |
    Вкладка не закрывается автоматически. 
    По центру или вверху экрана всплывает нативное системное окно браузера с предупреждением (например: «Возможно, внесенные изменения не сохранятся»).
    В окне присутствуют две кнопки выбора: одна для подтверждения выхода (страница закроется), вторая — для отмены действия (пользователь остается на сайте, корзина сохраняется).

- summary: |
    Проверка визуального выделения активного языка в интерфейсе
  requirement: |
    Переключатель языка интерфейса должен визуально выделять выбранный на данный момент язык 
  prerequisites: |
    - Сайт открыт на главной странице
  test-data: " "
  steps:
    - Шаг 1 Визуально оценить переключатель языков в шапке сайта при первой загрузке (по дефолту активен английский язык)
    - Шаг 2 Нажать на кнопку переключения локализации на русский язык
    - Шаг 3 Визуально оценить изменения в переключателе языков после смены локализации
  expected-result: |
    На шаге 1 кнопка или иконка English имеет явное визуальное выделение относительно кнопки Russian (например: изменена заливка, текст стал жирным, появилось подчеркивание или рамка).
    На шаге 3 визуальный фокус мгновенно переходит на кнопку Russian: теперь она подсвечена как активная, а кнопка English становится блеклой / неактивной.

- summary: |
    Проверка успешного перехода в соответствующую категорию при клике на хэштег в карточке товара
  requirement: |
    Пользователь должен иметь возможность переходить в соответствующую категорию товаров при клике на хэштег на странице товара 
  prerequisites: |
    - Сайт открыт на главной странице
  test-data: " "
  steps:
    - На странице каталога открыть карточку любого товара
    - На странице товара найти хэштег и указанием категории товара, нажать на него
  expected-result: |
      После первого шага открывается страница товара, где отображается кликабельный хэштег.
      После второго шага происходит переход на страницу каталога, отфильтрованную по выбранной категории (хэштегу).
      В списке товаров отображаются только те позиции, которые соответствуют этой категории.

