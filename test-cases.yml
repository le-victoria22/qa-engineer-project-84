---
- summary: |
    Проверка успешного поиска товаров по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites:
    - Пользователь находится на главной странице интернет-магазина
    - В каталоге есть товары, содержащие в названии слово «pepper»
  steps:
    - Кликнуть по строке поиска
    - Ввести в строку поиска ключевое слово "pepper"
  expected-result: |
    Отображается список товаров, соответствующих запросу "pepper"

- summary: |
    Проверка успешной фильтрации товаров по бренду
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites:
    - Пользователь находится на главной странице интернет-магазина
    - Блок фильтра по бренду отображается на странице и содержит чекбоксы
  test-data: |
    Бренд_1 = Dior, Бренд_2 = Chanel
  steps:
    1. Установить чекбокс напротив Бренда_1
    2. Установить чекбокс напротив Бренда_2, не снимая выделение с Бренда_1
    3. Снять чекбоксы с Бренда_1 и Бренда_2
  expected-result: |
    На шаге 1 Список товаров обновился, в выдаче присутствуют только товары, соответствующие Бренду_1
    На шаге 2 Список товаров обновился, в выдаче одновременно отображаются и товары Бренда_1, и товары Бренда_2
    На шаге 3 Список товаров вернулся к исходному состоянию

- summary: |
    Проверка успешной фильтрации товаров по наличию
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites:
    - Пользователь находится на главной странице интернет-магазина
    - Чекбокс напротив фильтра "In Stock" установлен по умолчанию
    - В выдаче отображаются только товары, которые есть в наличии (счётчик имеющегося количества у каждого товара больше 0)
  steps:
    1. Снять чекбокс с фильтра "In Stock"
    2. Нажимать на кнопку "Next", переходя со страницы на страницу, просматривая каталог
    3. Повторно установить чекбокс напротив фильтра "In Stock"
  expected-result: |
    На шаге 1 Список товаров обновился, в выдаче появились товары, которых нет в наличии, со счетчиком имеющегося количества 0. Если на странице нет таких товаров, то выводится сообщение, что ничего не найдено
    На шаге 2 На каждой странице каталога отображаются товары, которых нет в наличии, или сообщение о том, что таких товаров нет
    На шаге 3 Список товаров обновился, в каталоге снова отображаются только товары в наличии

- summary: |
    Проверка успешной фильтрации товаров по цене по точным границам доступного диапазона
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites:
    - Пользователь находится на любой странице интернет-магазина
    - Предварительно определили товар с самой минимальной и максимальной ценой в каталоге
  test-data: |
    Мин_цена = 0.71, Макс_цена = 30917.19 (во 2 версии приложения - 13961.99)
  steps:
    - Ввести в поле фильтра "From" значение Мин_цена, а в поле "To" - Макс_цена
    - Листать каталог по страницам кнопками "Next" и "Previous"
  expected-result: |
    В каталоге отображаются все товары, включая самые крайние товары с Мин_цена и Макс_цена.

- summary: |
    Проверка успешного отсечения крайних товаров при сдвиге границ ценового диапазона внутрь
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites:
    - Пользователь находится на любой странице интернет-магазина
  test-data: |
    Мин_цена = 0.71, Макс_цена = 30917.19 (во 2 версии приложения - 13961.99)
  steps:
    1. Ввести в поле фильтра "From" значение "Мин_цена+0.01", листать каталог по страницам кнопками "Next" и "Previous"
    2. Очистить поле "From" и ввести в поле "To" - "Макс_цена-0.01", листать каталог по страницам кнопками "Next" и "Previous"
  expected-result: |
    На шаге 1 Список товаров обновился, товар стоимостью 0.71 скрылся из выдачи
    На шаге 2 Список товаров обновился, самый дорогой товар скрылся из выдачи

- summary: |
    Проверка успешного фильтра по цене при вводе значений за пределами доступного диапазона
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites:
    - Пользователь находится на любой странице интернет-магазина
  test-data: |
    Мин_цена = 0.71, Макс_цена = 30917.19 (во 2 версии приложения - 13961.99)
  steps:
    1. Ввести в поле фильтра "From" значение "Мин_цена-0.01"
    2. Очистить поле "From" и ввести в поле "To" - "Макс_цена+0.01"
    3. Листать каталог по страницам кнопками "Next" и "Previous"
  expected-result: |
    На шаге 1 Список товаров обновился, все доступные в каталоге товары остались в выдаче
    На шаге 2 Список товаров обновился, все доступные в каталоге товары остались в выдаче

- summary: |
    Проверка успешного ручного сброса ценового фильтра
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites:
    - Пользователь ввёл в поля "From" и "To" значения цен
    - Список товаров в каталоге отфильтрован
  steps:
    - Удалить все символы из полей "From" и "To"
  expected-result: |
    Ценовой фильтр сброшен, поля ввода пустые, список товаров вернулся к исходному состоянию

- summary: |
    Проверка успешного сброса нижней границы ценового фильтра
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites:
    - Пользователь ввёл в поля "From" значение
    - Список товаров в каталоге отфильтрован
  test-data: |
    Поле_От = 3
  steps:
    1. Навести курсор на поле ввода "From", чтобы отобразились графические стрелочки
    2. Кликать по стрелочке вниз, пока значение не станет равным 0
  expected-result: |
    1. При каждом клике стрелочки вниз значение уменьшается на установленный шаг, после достижения 0 дальнейшее уменьшение значения невозможно
    2. Список товаров обновляется, ограничение снизу снято

- summary: |
    Проверка успешного сброса верхней границы ценового фильтра 
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites:
    - Пользователь ввёл в поля "To" значение
    - Список товаров в каталоге отфильтрован
  test-data: |
    Поле_До = 30917 (во 2 версии приложения - 13961)
  steps:
    1. Навести курсор на поле ввода "To", чтобы отобразились графические стрелочки
    2. Кликать по стрелочке вверх, пока значение не станет равным 30918 (во 2 версии приложения - 13962)
  expected-result: |
    1. При каждом клике стрелочки вверх значение увеличивается на установленный шаг, цена становится больше максимальной цены в каталоге
    2. Список товаров обновляется, ограничение сверху снято

- summary: |
    Проверка невозможности ввода отрицательного значения в поле цены 
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites:
   - Пользователь находится на любой странице каталога
   - Фильтры находятся в исходном состоянии
  steps:
    1. Установить курсор в поле ввода "From"
    2. Ввести в поле знак "-" и любое число
  expected-result: |
    1. При попытке ввода с клавиатуры знака "-" он не отображается в поле или система автоматически удаляет его
    2. Выводится сообщение о том, что число должно быть положительным
    3. Список товаров отображается корректно, начиная с товаров с минимальной ценой

- summary: |
    Проверка валидации полей фильтра цены при вводе значения "From", превышающего значение "To"
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites:
   - Пользователь находится на любой странице каталога
   - Фильтры находятся в исходном состоянии
  test-data: |
    Поле_От = 10, Поле_До = 3
  steps:
    1. Установить курсор в поле ввода "To" и ввести значение Поле_До
    2. Установить курсор в поле ввода "From" и ввести значение Поле_От
  expected-result: |
    1. Система определяет логическую ошибку
    2. Под полем ввода появляется сообщение об ошибке "Price From cannot be greater than Price To"
    3. Автоматическое обновление каталога не происходит, фильтр не применяется
    4. Каталог товаров не ломается, не отображает пустую страницу

- summary: |
    Блокировка ввода букв, спецсимволов и математических знаков в числовой фильтр цены
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites:
   - Пользователь находится на любой странице каталога
   - Фильтры находятся в исходном состоянии
   - В буфер обмена скопирован Текст
  test-data: |
    Текст = цена
  steps:
    1. Установить курсор в поле ввода "From" и попробовать последовательно ввести с клавиатуры: латинские буквы (abc), кириллицу (тест), спецсимволы (@, $, %) и математические знаки (+, =, /)
    2. Попробовать ввести в поле латинскую букву "e" или русскую "е"
    3. Попробовать вставить в поле ввода текст из буфера обмена
  expected-result: |
    1. Поле ввода игнорирует нажатия клавиш с буквами, спецсимволами и знаками
    2. Поле ввода игнорирует нажатия клавиш с буквой е
    3. Попытка вставки буквенного текста из буфера обмена блокируется — поле остается пустым
    4. Фильтрация каталога не срабатывает на некорректные данные

- summary: |
    Проверка успешного просмотра каталога товаров
  requirement: |
    Пользователь должен иметь возможность просматривать товары
  prerequisites: |
    - Пользователь находится на главной странице каталога
  steps:
    - Нажимать на кнопку "Next", переходя со страницы на страницу, просматривая каталог
  expected-result: |
    Товары отображаются, у каждого товара видны фото, название, рейтинг, описание, цена, кнопка "Add to cart"

- summary: |
    Проверка успешного успешного открытия карточки товара
  requirement: |
    Пользователь должен иметь возможность просматривать подробную информацию о товаре
  prerequisites: |
    - Пользователь находится на любой странице каталога
  steps:
    - Кликнуть по названию или изображению любого товара из каталога
  expected-result: |
    Успешно открывается отдельная страница выбранного товара, отображается вся подробная информация о товаре: фото, название, рейтинг, цена, описание, кнопка "Add to cart"

- summary: |
    Проверка успешного добавления товара в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: |
    - Пользователь находится на любой странице каталога
    - В каталоге есть товар с ценой, остаток на складе больше 0
  steps:
    - Нажать на кнопку "Add to cart" в карточке товара
  expected-result: |
    Счетчик на иконке корзины в шапке сайта увеличился на 1

- summary: |
    Проверка успешного просмотра содержимого корзины
  requirement: |
    Пользователь должен иметь возможность просматривать содержимое корзины
  prerequisites: |
    - Пользователь находится на любой странице каталога
    - В корзину уже добавлен товар, счетчик на иконке корзины больше 0
  steps:
    - Нажать на корзину в шапке сайта
  expected-result: |
    Выполнен переход на страницу корзины, в списке товаров отображается именно добавленный товар, цена, название совпадают с карточкой товара

- summary: |
    Проверка успешного изменения языка интерфейса
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса
  prerequisites: |
    - Пользователь находится на главной странице сайта
    - По умолчанию установлен язык English
    - На сайте доступен альтернативный язык (Russian)
  steps:
    1. Найти в шапке сайта переключатель языков и нажать на него
    2. В списке выбрать язык Russian
    3. Проверить основные элементы интерфейса текущей страницы
    4. Перейти на любую другую страницу магазина
  expected-result: |
    На шаге 1 Открывается выпадающий список с доступными языками.
    На шаге 2 Контент на странице должен обновиться.
    На шаге 3 Весь текст переведён на русский язык, перевод корректен, текст не вылезает за границы элементов.
    На шаге 4 Новая страница открывается сразу на русском языке.

- summary: |
    Проверка адаптивности отображения страниц сайта на мобильном разрешении экрана
  requirement: |
    Сайт должен иметь мобильную версию
  prerequisites: |
    - Открыта панель разработчика (DevTools) в браузере Google Chrome
  steps:
    1. Переключить отображение в мобильный режим
    2. В выпадающем списке устройств выбрать модель iPhone SE (ширина экрана 375px)
    3. Проскроллить страницу каталога товаров сверху вниз
  expected-result: |
    1. Контент страницы полностью помещается по ширине экрана
    2. Нет поплывшей верстки, все элементы страницы перестроились под мобильный экран

- summary: |
    Проверка работоспособности мобильных элементов навигации
  requirement: |
    Сайт должен иметь мобильную версию
  prerequisites: |
    - Сайт открыт в мобильном режиме на главной странице
  steps:
    Переходить по каталогу с помощью кнопок "Next" и "Previous"
  expected-result: |
    Происходит корректный переход на каждую страницу каталога, страницы загружаются без ошибок

- summary: |
    Проверка удобства использования
  requirement: |
    Сайт нужно разработать с учетом удобства использования и оптимизировать для скорости работы
  prerequisites: |
    - Сайт открыт на главной странице
  steps:
    1. Проверить доступность корзины, удобство перехода в корзину
    2. Проверить кликабельность фильтров слева и поля фильтров на удобство ввода
    3. Проверить кликабельность кнопок "Next" и "Previous"
  expected-result: |
    Интерфейс понятен, все ключевые элементы находятся на ожидаемых местах.
    Элементы управления достаточно крупные, по ним легко кликнуть мышью.

- summary: |
    Ручная проверка скорости работы
  requirement: |
    Сайт нужно разработать с учетом удобства использования и оптимизировать для скорости работы
  prerequisites: |
    - Сайт открыт на главной странице
  steps:
    1. Открыть инструменты разработчика, перейти на вкладку Network (Сеть)
    2. Обновить страницу сайта, зафиксировать в нижней строке вкладки Network скорость загрузки страницы (Load)
    3. Нажать кнопку «Next» для перехода на другую страницу каталога и также оценить скорость визуального обновления товаров
  expected-result: |
    Сайт визуально загружается быстро (в пределах 1–3 секунд). Нет ощущения «зависания» интерфейса.
    При переключении страниц кнопками «Next»/«Previous» новые товары появляются на экране практически мгновенно.

- summary: |
    Проверка корректности отображения страниц сайта на разрешении планшетов
  requirement: |
    Сайт должен быть доступен на различных устройствах
  prerequisites: |
    - Сайт открыт на главной странице
    - В DevTools включен мобильный режим
    - Выбрано устройство iPad Mini
  steps:
    1. Проскроллить страницу каталога товаров сверху вниз
    2. Проверить расположение элементов
    3. Перевернуть экран в горизонтальный режим (Rotate), повторить шаги 1 и 2
  expected-result: |
    В обоих режимах вёрстка не ломается, текст и картинки отображаются корректно

- summary: |
    Проверка корректности отображения страниц сайта в режиме эмуляции мобильной ОС Android
  requirement: |
    Сайт должен быть доступен на различных устройствах
  prerequisites: |
    - Сайт открыт на главной странице
    - В DevTools включен мобильный режим
  steps:
    1. В списке устройств выбрать Samsung Galaxy S8+
    2. Проскроллить страницу каталога товаров сверху вниз
    3. Проверить расположение элементов
    4. Перевернуть экран в горизонтальный режим (Rotate)
  expected-result: |
    Интерфейс корректно переключился на мобильное отображение для устройства Android, текст, картинки, стрелочки, кнопки, поля ввода отображаются корректно

- summary: |
    Проверка поисковой строки на устойчивость к XSS-инъекциям
  requirement: |
    Сайт должен быть безопасным и защищать данные пользователя
  prerequisites: |
    - Сайт открыт на любой странице каталога
  steps: |
    1. Найти строку поиска по ключевому слову
    2. Ввести в поле поиска следующий тестовый скрипт: <script>alert('XSS')</script>
    3. Нажать клавишу Enter
  expected-result: |
    Браузер не выводит модальное окно (alert) с текстом «XSS», система обрабатывает ввод как обычную строку текста. 

- summary: |
    Проверка устойчивости сайта к ручному изменению параметров ID в URL
  requirement: |
    Сайт должен быть безопасным и защищать данные пользователя
  prerequisites: |
    - Сайт открыт на странице любого существующего товара в каталоге
    - В адресной строке браузера в конце ссылки виден номер товара (например, /products/1)
  steps: |
    1. Выделить мышкой числовой номер товара в самом конце адресной строки браузера
    2. Изменить это число на заведомо несуществующий или отрицательный номер (например, заменить /products/1 на /products/-9999)
    3. Нажать клавишу Enter
  expected-result: |
    Сайт корректно обрабатывает некорректный путь и не падает со сбоем, сохраняется контекст приложения.
    В части, где была карточка товара, пользователю отображается интерфейс с сообщением об ошибке (например, "Товар не найден").

- summary: |
    Проверка кроссбраузерной совместимости приложения в актуальных версиях браузеров
  requirement: |
    Сайт нужно протестировать на совместимость с последними версиями браузеров
  prerequisites: |
    - Сайт открыт на главной странице каталога
    - На тестовом окружении установлены последние стабильные версии браузеров (актуальные на дату тестирования):
      - Google Chrome (версия 155+)
      - Mozilla Firefox (версия 158+)
      - Safari (версия 18)
  steps:
    1. Открыть сайт в проверяемом браузере
    2. Визуально оценить расположение блоков и эелементов, нет ли дефектов верстки
    3. Проскроллить страницу каталога вниз, оценить внешний вид элементов
    4. Пролистать каталог, нажимая кнопки "Previous" и "Next", оценивая внешний вид элементов
    5. Оценить поле фильтров в левой части каталога - поле поиска, чекбоксы с брендами, фильтр по цене
    6. Открыть страницу любого товара, оценить её внешний вид
    7. Добавить товар в корзину, нажать на иконку корзины, оценить внешний вид страницы с корзиной
    8. Повторить шаги 1-7 для каждого браузера 
  expected-result: |
    Во всех браузерах блоки отображаются корректно, фильтры находятся слева и не наезжают на каталог, карточки товаров выстроены в аккуратную сетку.
    Поля поиска, цены и чекбоксы брендов имеют одинаковый ровный дизайн, не съезжают относительно левой панели.
    Все кнопки отображаются корректно, текст внутри них не съезжает, кнопки кликабельны.
    В корзине все элементы управления и информация о товаре отображаются корректно во всех браузерах.

- summary: |
    Проверка успешного применения локализации на сайте
  requirement: |
    Сайт должен иметь локализацию (перевод) на русский и английский языки
  prerequisites: |
    - Сайт открыт на главной странице
  steps: |
    1. Проверить английский текст на всех элементах страницы, добавить в корзину любой товар, и также проверить текст на странице корзины
    2. Переключить язык в шапке сайта на русский, проверить текст на странице корзины, переключиться в каталог и проверить текст на соответствие там
  expected-result: |
   Все тексты переведены на выбранный язык, длина слов не ломает вёрстку.

- summary: |
    Проверка прямого доступа к сайту без использования VPN
  requirement: |
    Сайт должен быть доступен для пользователей без использования VPN (прямой доступ из сети Интернет)
  prerequisites: |
    - На тестовом устройстве полностью отключены любые VPN-сервисы, прокси-серверы, сторонние DNS. Используется стандартное интернет-подключение провайдера.
  steps: |
    1. Открыть браузер
    2. Ввести в адресную строку прямой URL-адрес сайта и нажать Enter
  expected-result: |
   Сайт успешно и быстро загружается по прямой ссылке, в браузере отсутствуют ошибки сетевого доступа.

- summary: |
    Проверка корректности соотношения старой и новой цены товаров
  requirement: |
    Цена со скидкой должна быть всегда меньше основной цены
  prerequisites: |
    - Сайт открыт на главной странице каталога 
  steps: |
    1. Сравнить цифровые значения основной цены и цены со скидкой для каждого товара
    2. Используя кнопки «Next», перейти на вторую и следующие страницы каталога и повторить визуальную сверку цен
  expected-result: |
   Значение цены со скидкой всех товаров строго меньше, чем значение основной (старой) цены.
   Нет товаров, у которых скидочная цена равна основной или превышает её.

- summary: |
    Проверка корректности отображения товаров без скидки
  requirement: |
    Если для товара скидка не задана, то должна выводиться только одна актуальная цена
  prerequisites: |
    - Сайт открыт на главной странице каталога 
  steps: |
    - Найти товар, для которого скидка не установлена
  expected-result: |
   На карточке выводится только одна актуальная цена, перечеркнутых цен нет.

- summary: |
    Проверка визуального отображения цены со скидкой
  requirement: |
    При наличии скидки старая цена отображается перечеркнутой и менее яркой, а новая цена — контрастной или крупным/жирным шрифтом
  prerequisites: |
    - Сайт открыт на главной странице каталога 
  steps: |
    - Найти в каталоге любой товар, у которого есть скидка
  expected-result: |
   Старая (основная) цена отображается блеклым (менее ярким) цветом и визуально перечеркнута горизонтальной линией.
   Новая цена (со скидкой) визуально выделяется на фоне старой: она имеет более крупный/жирный шрифт или контрастный цвет.
   Тексты цен не накладываются друг на друга и не выходят за границы карточки товара.

- summary: |
    Проверка наличия и работы кнопки сброса фильтрации
  requirement: |
    В блоке фильтров каталога должна быть предусмотрена кнопка «Сбросить фильтры»
  prerequisites: |
    - Сайт открыт на главной странице каталога 
  steps: |
    1. Применить любой параметр в левой панели фильтров, чтобы изменить текущую выдачу товаров в каталоге
    2. Визуально осмотреть панель фильтров на предмет наличия элемента управления для отмены всех фильтров (кнопка «Сбросить фильтры»)
    3. Нажать на кнопку
  expected-result: |
   В левой панели фильтров визуально присутствует кнопка «Сбросить фильтры».
   После нажатия на неё все введённые значения цен, поисковое слово и выбранные бренды мгновенно очищаются, а каталог возвращается к полному списку товаров.

- summary: |
    Проверка кликабельности названия товара в корзине
  requirement: |
    Название товара внутри корзины должно быть кликабельной ссылкой, ведущей на страницу этого товара
  prerequisites: |
    - Сайт открыт на главной странице каталога
    - В корзину добавлен 1 товар
  steps: |
    - Перейти в корзину и кликнуть по названию товара
  expected-result: |
   Название является ссылкой, осуществляется переход на детальную страницу этого конкретного товара.

- summary: |
    Проверка успешного изменения количества товара внутри корзины
  requirement: |
    Пользователь должен иметь возможность изменять количество каждого товара прямо в корзине 
  prerequisites: |
    - Открыта страница корзины
    - В корзину добавлен 1 товар
  steps: |
    - Визуально проверить строку товара на наличие элементов управления количеством
    - Попробовать изменить количество товара в корзине
  expected-result: |
   В корзине присутствует рабочий интерфейс для изменения количества каждого товара.
   При изменении количества общая стоимость товара и итоговая сумма корзины автоматически пересчитываются.

- summary: |
    Успешная очистка корзины после оформления заказа
  requirement: |
    После оформления заказа содержимое корзины должно полностью очищаться, а счётчик товаров в корзине — сбрасываться 
  prerequisites: |
    - Открыта страница корзины
    - В корзину добавлены любые товары
  steps: |
    1. Нажать кнопку "Checkout"
    2. При появлении всплывающего сообщения «Order placed successfully» визуально оценить состояние счётчика корзины в шапке и страницы корзины на заднем фоне
    3. Нажать кнопку «Close» внутри всплывающего сообщения
    4. Проверить финальное состояние страницы корзины и счётчика товаров
  expected-result: |
    На шаге 2 счётчик товаров в корзине в шапке сайта сразу сбрасывается, а список товаров на фоне очищается.
    На шаге 4 страница корзины отображается в пустом состоянии, товары в ней полностью отсутствуют.

- summary: |
    Проверка предупреждения при закрытии вкладки с товарами в корзине 
  requirement: |
    Если в корзине есть товары, при закрытии вкладки или браузера сайт должен предупреждать о потере данных сессии
  prerequisites: |
    - В корзину добавлены любые товары
  steps: |
    - Не оформляя заказ, попытаться закрыть вкладку сайта или обновить страницу
  expected-result: |
    Вкладка не закрывается автоматически. 
    По центру или вверху экрана всплывает нативное системное окно браузера с предупреждением (например: «Возможно, внесенные изменения не сохранятся»).
    В окне присутствуют две кнопки выбора: одна для подтверждения выхода (страница закроется), вторая — для отмены действия (пользователь остается на сайте, корзина сохраняется).

- summary: |
    Проверка визуального выделения активного языка в интерфейсе
  requirement: |
    Переключатель языка интерфейса должен визуально выделять выбранный на данный момент язык 
  prerequisites: |
    - Сайт открыт на главной странице
  steps: |
    1. Визуально оценить переключатель языков в шапке сайта при первой загрузке (по дефолту активен английский язык)
    2. Нажать на кнопку переключения локализации на русский язык
    3. Визуально оценить изменения в переключателе языков после смены локализации
  expected-result: |
    На шаге 1 кнопка или иконка English имеет явное визуальное выделение относительно кнопки Russian (например: изменена заливка, текст стал жирным, появилось подчеркивание или рамка).
    На шаге 3 визуальный фокус мгновенно переходит на кнопку Russian: теперь она подсвечена как активная, а кнопка English становится блеклой / неактивной.
