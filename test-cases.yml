- summary: |
    Проверка успешного перехода из корзины в каталог товаров по кнопке "Continue shopping"
  requirement: |
    На странице корзины должна быть реализована кнопка/ссылка для возврата в каталог с целью продолжения покупок
  prerequisites: |
    - В корзину добавлен товар
    - Пользователь находится на странице корзины
    - Открыт DevTools, вкладка Network
  test-data: " "
  steps:
    - Нажать на кнопку для возврата в каталог "Continue shopping"
  expected-result: |
      Осуществляется успешный возврат на страницу каталога товаров.
      В DevTools на вкладке Network фиксируется успешный сетевой запрос (GET) на получение списка товаров со статусом ответа 200 OK.

- summary: |
    Проверка работы сайта в режиме SPA (без перезагрузки страниц при навигации)
  requirement: |
    Сайт должен быть SPA-приложением, которое не перезагружает страницу
  prerequisites: |
    - Сайт открыт на главной странице каталога
    - Открыта панель DevTools на вкладке Network
  test-data: " "
  steps:
    - Выполнить переход на следующую страницу каталога
    - Выполнить переход на детальную страницу любого товара
    - Нажать на кнопку «Cart» в шапке сайта для перехода в корзину
    - Нажать на кнопку возврата в каталог
    - Посмотреть на лог запросов во вкладке Network и на поведение иконки обновления страницы в браузере
  expected-result: |
      Переходы между всеми страницами происходят мгновенно, без полной перезагрузки и «мигания» вкладки браузера.
      Иконка обновления страницы в браузере во время переходов не превращается в крестик.
      В DevTools на вкладке Network лог запросов сохраняется и накапливается непрерывно. История предыдущих запросов не очищается, что подтверждает отсутствие полной перезагрузки.
