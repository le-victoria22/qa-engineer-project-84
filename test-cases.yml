---
- summary: |
    Краткое описание тест-кейса. Например, проверка входа пользователя с существующими логином и паролем
  requirement: |
    Тестируемое требование. Например, при верном вводе логине и пароля пользователь должен войти в систему
  prerequisites: |
    Это условия, которые необходимы для проведения тест-кейса. Они должны быть выполнены еще до запуска тест-кейса.
    Например, открыта страница логина
  test-data: |
    Тестовые данные
    Логин = ilona Пароль = password
  steps:
    - Вводим логин
    - Вводим пароль
    - Нажимаем кнопку «Войти»
  expected-result: |
    Пользователь должен попасть на главную страницу

- summary: |
    Проверка успешного поиска товаров по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites:
    - Пользователь находится на главной странице интернет-магазина
    - В каталоге есть товары, содержащие в названии слово «pepper»
  steps:
    - Кликнуть по строке поиска
    - Ввести в строку поиска ключевое слово "pepper"
  expected-result: |
    Отображается список товаров, соответствующих запросу "pepper"

- summary: |
    Проверка успешной фильтрации товаров по категории
  requirement: |
    Пользователь должен иметь возможность искать товары по категории
  prerequisites:
    - Пользователь находится на главной странице интернет-магазина
    - В системе есть категория "Dior"
  steps:
    - В блоке фильтров поставить флажок напротив категории "Dior"
  expected-result: |
    Отображается список товаров, соответствующих категории "Dior"
