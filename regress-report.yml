bugreports:
  - summary: |
      Фильтр товаров «In Stock» не работает, а при его изменении исчезает кнопка перехода на следующую страницу "Next"
    environment: |
      Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
      ОС Windows 10
    steps-to-reproduce: |
      1. Открыть первую страницу каталога
      2. Снять чекбокс напротив фильтра "In Stock"
    expected-result: |
      Список товаров обновился, в выдаче появились товары, которых нет в наличии, со счетчиком имеющегося количества 0.
      Кнопки переключения страниц должны корректно отображаться и работать при любых комбинациях и переключениях фильтров.
    actual-result: |
      Список товаров не отфильтровался должным образом. В выдаче по-прежнему присутствуют товары в наличии.
      При снятии чекбокса с фильтра полностью исчезает кнопка перехода на следующую страницу.
      Ошибка изображена на скриншоте assets/bug_regression_filter_in_stock.png

  - summary: |
      Рассинхронизация фильтра цены и пагинации
    environment: |
      Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
      ОС Windows 10
    steps-to-reproduce: |
      1. Открыть первую страницу каталога (где самый дешёвый товар - 0.99, самый дорогой - 2499.99)
      2. В поле фильтра цены "From" ввести значение 0.98
      3. Изменить значение на 0.99
      4. Стереть поле "From" 
      5. В поле "To" ввести значение 2499.99
      6. Изменить значение на 2500
      7. Стереть поле "To" 
      8. Открыть вторую страницу каталога кнопкой "Next" (где самый дешёвый товар - 0.79, самый дорогой - 59.99)
      9. В поле фильтра цены "From" ввести значение 0.78
      10. Изменить значение на 0.79
      11. Стереть поле "From" 
      12. В поле "To" ввести значение 59.99
      13. Изменить значение на 60
      14. Стереть поле "To" 
    expected-result: |
      Кнопки переключения страниц должны корректно отображаться и работать при любых комбинациях и переключениях фильтров.
      Фильтр должен корректно работать и показывать товары, соответствующие введенным значениям
    actual-result: |
      При вводе значений в пределах доступного диапазона цен на текущей странице каталога фильтр срабатывает, но кнопка "Next" полностью исчезает.
      При вводе значений за пределами доступного диапазона цен на текущей странице каталога фильтр не срабатывает, на экране остаются все товары текущей страницы и не выводится сообщение «Ничего не найдено», при этом кнопка "Next" на месте.
      Также обнаружено, что при расчете фильтра система берет первоначальную цену товара (до скидки), полностью игнорируя акционную цену со скидкой (дефект перешел из первой версии приложения).      
      Ошибка изображена на скриншоте assets/bug_regression__price_out.png и assets/bug_regression_price_in.png

  - summary: |
      Исчезновение кнопки "Next" при фильтрации по бренду
    environment: |
      Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
      ОС Windows 10
    steps-to-reproduce: |
      1. Открыть третью страницу каталога
      2. Установить чекбокс напротив бренда Gigabyte
      3. Нажать кнопку "Previous"
    expected-result: |
      Кнопки переключения страниц должны корректно отображаться и работать при любых комбинациях и переключениях фильтров.
      Фильтр должен корректно работать и показывать товары, соответствующие введенным значениям
    actual-result: |
      При установленном чекбоксе исчезает кнопка "Next".
      Если нажать кнопку "Previous", пользователь оказывается в ловушке - на предыдущей странице кнопка "Next" также не отображается, а выбранный фильтр исчезает.
      Получается, что назад пользователь не может вернуться из-за исчезнувшей кнопки "Next", чтобы снять выбранный фильтр.
      Пользоваться каталогом невозможно.
      Ошибка изображена на скриншоте assets/bug_regression_filter_brand.png

  - summary: |
      Ухудшение работы фильтра цен при вводе минимальной цены ("From"), превышающей максимальную ("To"), по сравнению с первой версией приложения
    environment: |
      Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
      ОС Windows 10
    steps-to-reproduce: |
      1. Установить курсор в поле ввода "To" и ввести значение 3
      2. Установить курсор в поле ввода "From" и ввести значение 10
    expected-result: |
      1. Система определяет логическую ошибку
      2. Под полем ввода появляется сообщение об ошибке "Price From cannot be greater than Price To"
      3. Автоматическое обновление каталога не происходит, фильтр не применяется
      4. Каталог товаров не ломается, не отображает пустую страницу
    actual-result: |
      Система одобряет ввод. 
      На экране отображаются товары, которые абсолютно не соответствуют введенным условиям фильтра.
      Если в первой версии приложения система хотя бы давала ответ, что ничего не найдено, то теперь в каталоге выводятся совершенно случайные товары.
      Ошибка изображена на скриншоте assets/bug_regression_from_greater_than_to.png.png

  - summary: |
      Некорректное расположение блока фильтров и размеры картинок на мобильном разрешении экрана
    environment: |
      Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
      ОС Windows 10
      DevTools - Toggle device toolbar - iPhone SE (ширина экрана 375px)
    steps-to-reproduce: |
      Проскроллить страницу каталога товаров сверху вниз
    expected-result: |
      Контент страницы полностью помещается по ширине экрана.
      Нет поплывшей верстки, все элементы страницы перестроились под мобильный экран.
    actual-result: |
      Блок фильтров «улетел» вниз страницы. Чтобы воспользоваться фильтрацией, пользователю приходится прокручивать всю страницу до конца.
      Также обрезаны картинки в каталоге товаров.
      Ошибка изображена на скриншоте assets/bug_regression_mobile.png  

  - summary: |
      Сбой логики строки поиска по ключевым словам
    environment: |
      Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
      ОС Windows 10
    steps-to-reproduce: |
      1. Открыть первую страницу каталога
      2. Ввести в строку поиска ключевое слово "pepper"
      3. Стереть слово
      4. Ввести слово, поиск по которому не даст совпадений - например, "школа"
    expected-result: |
      На шаге 2 Отображается список товаров, соответствующих запросу "pepper".
      На шаге 4 Должно появиться сообщение, что по вашему запросу ничего не найдено.
    actual-result: |
      При ввода любого ключевого слова исчезает кнопка "Next" на странице.
      При вводе ключевого слова, по которому не может быть совпадений, поиск проигнорирован, на экране продолжают отображаться все товары текущей страницы.
      Ошибка изображена на скриншоте assets/bug_regression_keyword_search.png

  - summary: |
      Нарушение адаптивности интерфейса каталога на разрешениях планшетов
    environment: |
      Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
      ОС Windows 10
      DevTools - Toggle device toolbar - iPad Mini 
    steps-to-reproduce: |
      1. Открыть сайт на главной странице
      2. Проскроллить страницу каталога товаров сверху вниз и проверить расположение элементов
      3. Перевернуть экран в горизонтальный режим (Rotate), повторить шаг 2
    expected-result: |
      Вёрстка не ломается, текст и картинки отображаются корректно
    actual-result: |
      После первой версии приложения пропорции картинок товаров в каталоге восстановились, но некоторые картинки стали сильно обрезаны, из-за чего часть деталей товара скрыта от пользователя.
      Ошибка изображена на скриншоте assets/bug_regression__tablet.png

  - summary: |
      Некорректное расположение блока фильтров и размеры картинок в режиме эмуляции мобильной ОС Android
    environment: |
      Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
      ОС Windows 10
      DevTools - Toggle device toolbar - Android (Samsung Galaxy S8+) 
    steps-to-reproduce: |
      Проскроллить страницу каталога товаров сверху вниз
    expected-result: |
      Интерфейс корректно переключился на мобильное отображение для устройства Android, текст, картинки, стрелочки, кнопки, поля ввода отображаются корректно
    actual-result: |
      Блок фильтров «улетел» вниз страницы. Чтобы воспользоваться фильтрацией, пользователю приходится прокручивать всю страницу до конца.
      Также обрезаны картинки в каталоге товаров.
      Ошибка изображена на скриншоте assets/bug_regression_android.png

  - summary: |
      Уменьшение размеров полей ввода фильтра цены в десктопной версии приложения
    environment: |
      Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
      ОС Windows 10
    steps-to-reproduce: |
      Открыть первую страницу каталога
    expected-result: |
      Размер input позволяет полностью видеть вводимые числа
    actual-result: |
      Размер input уменьшился (в первой версии приложения был 101.82*38), при вводе длинных или дробных чисел пользователь не видит, что ввёл.
      Ошибка изображена на скриншоте assets/bug_regression_input_form.png и assets/bug_regression_truncated_price.png
