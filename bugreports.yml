---
- summary: |
    Короткое описание ошибки
  environment: |
    Ссылка на билд/коммит/версия ПО и всего окружения
  steps-to-reproduce: |
    Полный перечень шагов для воспроизведения и описание, на каком шаге произошла ошибка
  expected-result: |
    Какой результат должен быть без ошибки
  actual-result: |
    Какой результат получился на самом деле

- summary: |
    Ошибка фильтрации товаров по верхнему значению диапазона цен
  environment: |
    Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
    ОС Windows 10
  steps-to-reproduce: |
    Ввести в поле фильтра "From" значение 0.71, а в поле "To" - 30917.19
  expected-result: |
    В каталоге отображаются все товары, включая самые крайние товары с ценами 0.71 и 30917.19
  actual-result: |
    Самый дорогой товар в каталоге не отображается (id=170).
    На вкладке Network в DevTools в ответе JSON для этого товара в поле цены передается базовая стоимость без скидки, которая выше установленного лимита фильтра.
    Ошибка изображена на скриншоте assets/bug_max_price.png

- summary: |
    Самый дешевый товар не отсекается при сдвиге минимальной границы диапазона внутрь
  environment: |
    Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
    ОС Windows 10
  steps-to-reproduce: |
    Ввести в поле фильтра "From" значение 0.72, листать каталог по страницам кнопками "Next" и "Previous"
  expected-result: |
    Список товаров обновился, товар стоимостью 0.71 скрылся из выдачи
  actual-result: |
    Самый дешевый товар (id=31) продолжает отображаться в каталоге.
    На вкладке Network в DevTools в ответе JSON для этого товара в поле цены передается базовая стоимость без скидки, которая выше установленного лимита фильтра.
    Ошибка изображена на скриншоте assets/bug_min_price.png

- summary: |
    Самый дорогой товар не отображается при вводе значений фильтра за пределами доступного диапазона
  environment: |
    Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
    ОС Windows 10
  steps-to-reproduce: |
    1. Ввести в поле фильтра "From" значение 0.7
    2. Очистить поле "From" и ввести в поле "To" - 30917.20
    3. Листать каталог по страницам кнопками "Next" и "Previous"
  expected-result: |
    На шаге 1 Список товаров обновился, все доступные в каталоге товары остались в выдаче
    На шаге 2 Список товаров обновился, все доступные в каталоге товары остались в выдаче
  actual-result: |
    При вводе значения цены за пределами доступного диапазона в каталоге перестает отображаться самый дорогой товар.
    Расширение нижней границы работает корректно.
    Система ошибочно валидирует товар по его базовой цене без скидки вместо акционной стоимости.
    Ошибка изображена на скриншоте assets/bug_max_price.png

- summary: |
    Самый дорогой товар не возвращается в выдачу при увеличении верхней границы фильтра стрелками выше максимальной цены в каталоге
  environment: |
    Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
    ОС Windows 10
  steps-to-reproduce: |
    1. Открыть каталог товаров.
    2. Установить верхнюю границу фильтра цены так, чтобы самый дорогой товар со скидкой скрылся (например, ввести цену ниже его стоимости вручную - 30917).
    3. Нажимая на стрелку «Вверх» в поле ввода максимальной цены, увеличить значение на 1 шаг.
    4. Проверить отображение самого дорогого товара в каталоге
  expected-result: |
    Цена становится больше максимальной цены в каталоге, список товаров обновляется, самый дорогой товар отображается.
  actual-result: |
    Значение цены в поле фильтра стало выше максимальной цены в каталоге, но самый дорогой товар (id=170) по-прежнему не отображается в каталоге.
    Система ошибочно валидирует товар по его базовой цене без скидки вместо акционной стоимости.
    Ошибка изображена на скриншоте assets/bug_max_price.png

- summary: |
    Поле ввода цены позволяет вводить отрицательные значения
  environment: |
    Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
    ОС Windows 10
  steps-to-reproduce: |
    1. Установить курсор в поле ввода "From"
    2. Ввести в поле знак "-" и любое число
  expected-result: |
    При попытке ввода с клавиатуры знака "-" он не отображается в поле или система автоматически удаляет его
    Выводится сообщение о том, что число должно быть положительным
    Список товаров отображается корректно, начиная с товаров с минимальной ценой
  actual-result: |
    Поле успешно принимает отрицательное значение -900.
    Каталог никак не сигнализирует об ошибке ввода, отображая все доступные товары.
    интерфейс сохраняет работоспособность при последующем вводе корректных данных.
    Ошибка изображена на скриншоте assets/bug__negative_price.png

- summary: |
    Отсутствует валидация при вводе минимальной цены ("From"), превышающей максимальную ("To")
  environment: |
    Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
    ОС Windows 10
  steps-to-reproduce: |
    1. Установить курсор в поле ввода "To" и ввести значение 3
    2. Установить курсор в поле ввода "From" и ввести значение 10
  expected-result: |
    Система определяет логическую ошибку
    Под полем ввода появляется сообщение об ошибке "Price From cannot be greater than Price To"
    Автоматическое обновление каталога не происходит, фильтр не применяется
    Каталог товаров не ломается, не отображает пустую страницу
  actual-result: |
    Фильтр успешно принимает некорректные значения. 
    При этом на экране отображается сообщение «Ничего не найдено», а система не выдает никаких предупреждений о том, что диапазон цен введен неверно.
    Ошибка изображена на скриншоте assets/bug_from_greater_than_to.png
  
- summary: |
    Отсутствует блокировка ввода латинской буквы "e" в числовые поля цен
  environment: |
    Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
    ОС Windows 10
  steps-to-reproduce: |
    Установить курсор в поле ввода "From" и попробовать ввести в поле латинскую букву "e" или русскую "е"
  expected-result: |
    1. Поле ввода игнорирует нажатия клавиш с буквой е
    2. Фильтрация каталога не срабатывает на некорректные данные
  actual-result: |
    Поле успешно принимает букву латинскую букву "e", каталог при этом не реагирует на ввод.
    Ошибка изображена на скриншоте assets/bug_exponent_input.png

- summary: |
    Отсутствует отображение рейтинга товаров в каталоге
  environment: |
    Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
    ОС Windows 10
  steps-to-reproduce: |
    Открыть главную страницу каталога
  expected-result: |
    Товары отображаются, у каждого товара видны фото, название, рейтинг, описание, цена, кнопка "Add to cart"
  actual-result: |
    Отсутствует отображение рейтинга товаров
    Ошибка изображена на скриншоте assets/bug_product_rating_not_visible.png

- summary: |
    Частичный перевод интерфейса при смене языка
  environment: |
    Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
    ОС Windows 10
  steps-to-reproduce: |
    1. Открыта главная страница каталога, найти в шапке сайта переключатель языков и нажать на него
    2. В списке выбрать язык Russian
    3. Проверить основные элементы интерфейса текущей страницы
    4. Перейти на любую другую страницу магазина
  expected-result: |
    На шаге 1 Открывается выпадающий список с доступными языками.
    На шаге 2 Контент на странице должен обновиться.
    На шаге 3 Весь текст переведён на русский язык, перевод корректен, текст не вылезает за границы элементов.
    На шаге 4 Новая страница открывается сразу на русском языке.
  actual-result: |
    Не переведены на русский язык описания товаров в карточке товаров.
    Ошибка изображена на скриншоте assets/bug_partial_translation_issue.png

- summary: |
    Нарушение адаптивной верстки страниц каталога и корзины на мобильных разрешениях
  environment: |
    Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
    ОС Windows 10
    DevTools - Toggle device toolbar - iPhone SE (ширина экрана 375px)
  steps-to-reproduce: |
    Проскроллить страницу каталога товаров сверху вниз
  expected-result: |
    Контент страницы полностью помещается по ширине экрана.
    Нет поплывшей верстки, все элементы страницы перестроились под мобильный экран.
  actual-result: |
    Интерфейс не адаптирован под мобильные экраны.
    Блок фильтров слева наезжает на каталог, поля ввода цены критически сузились.
    В каталоге в карточках товаров отсутствуют визуальные разделители и отступы между элементами.
    В корзине в кнопке "Checkout" на обоих языках обрезан текст кнопки.
    Ошибка изображена на скриншоте assets/bug_mobile1.png и assets/bug_mobile2.png

- summary: |
    Зависание невидимого фильтра при переключении страниц
  environment: |
    Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
    ОС Windows 10
  steps-to-reproduce: |
    1. Открыть главную страницу каталога
    2. Нажать фильтр "Dior", переключить следующую страницу, не снимая фильтра
  expected-result: |
    Все выбранные (активные) фильтры должны принудительно оставаться видимыми в панели фильтрации, даже если на текущей странице нет подходящих под них товаров.
    Или при смене страницы несовместимые фильтры должны автоматически сбрасываться до исходного состояния.
  actual-result: |
    В сетке каталога товаров отображается сообщение: «Ничего не найдено».
    В левой панели фильтров полностью исчезает чекбокс выбранного бренда, интерфейс фильтров перестраивается под ассортимент текущей страницы.
    Фильтр продолжает влиять на поисковый запрос, но снять галочку невозможно, так как её больше нет на экране.
    Скрипт пошагового воспроизведения шагов сохранен в assets/bug_filter.json

- summary: |
    Нарушение адаптивности интерфейса каталога на разрешениях планшетов
  environment: |
    Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
    ОС Windows 10
    DevTools - Toggle device toolbar - iPad Mini 
  steps-to-reproduce: |
    1. Открыть сайт на главной странице
    2. Проскроллить страницу каталога товаров сверху вниз и проверить расположение элементов
    3. Перевернуть экран в горизонтальный режим (Rotate), повторить шаг 2
  expected-result: |
    Вёрстка не ломается, текст и картинки отображаются корректно
  actual-result: |
    В книжной ориентации изображения товаров деформируются и становятся "приплюснутыми".
    Поля ввода цены критически сузились.
    Ошибка изображена на скриншоте assets/bug_tablet.png

- summary: |
    Нарушение верстки каталога и корзины в режиме эмуляции мобильной ОС Android
  environment: |
    Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
    ОС Windows 10
    DevTools - Toggle device toolbar - Android (Samsung Galaxy S8+) 
  steps-to-reproduce: |
    1. Открыть сайт на главной странице
    2. Проскроллить страницу каталога товаров сверху вниз и проверить расположение элементов
    3. Перевернуть экран в горизонтальный режим (Rotate), повторить шаг 2
  expected-result: |
    Интерфейс корректно переключился на мобильное отображение для устройства Android, текст, картинки, стрелочки, кнопки, поля ввода отображаются корректно
  actual-result: |
    Интерфейс не адаптирован под мобильное устройство Android.
    Блок фильтров слева наезжает на каталог, поля ввода цены критически сузились.
    В каталоге в карточках товаров отсутствуют визуальные разделители и отступы между элементами.
    В корзине в кнопке "Checkout" на обоих языках обрезан текст кнопки.
    Ошибка изображена на скриншоте assets/bug_android1.png и assets/bug_android2.png

- summary: |
    Критический сбой (белый экран) при ручном вводе несуществующего ID товара в URL
  environment: |
    Mozilla Firefox 158.0.1 (официальная сборка) (64 бит)
    ОС Windows 10
  steps-to-reproduce: |
    1. Открыть сайт на странице любого существующего товара в каталоге
    2. В адресной строке браузера в конце ссылки виден номер товара (например, /products/1)
    3. Выделить мышкой числовой номер товара в самом конце адресной строки браузера
    4. Изменить это число на заведомо несуществующий или отрицательный номер (например, заменить /products/1 на /products/-9999)
    5. Нажать клавишу Enter
  expected-result: |
    Сайт корректно обрабатывает некорректный путь и не падает со сбоем, сохраняется контекст приложения.
    В части, где была карточка товара, пользователю отображается интерфейс с сообщением об ошибке (например, "Товар не найден").
  actual-result: |
    Интерфейс сайта полностью исчезает, отображается пустой белый экран.
    В панели разработчика во вкладке Console фиксируются необработанные критические ошибки.
    Ошибка изображена на скриншоте assets/bug_white_screen.png

- summary: |
    Нарушение верстки сайта в браузере Safari
  environment: |
    Облачный сервис тестирования Browserling
    macOS 15, Safari 18
  steps-to-reproduce: |
    1. Открыть сайт в проверяемом браузере
    2. Визуально оценить расположение блоков и эелементов, нет ли дефектов верстки
    3. Проскроллить страницу каталога вниз, оценить внешний вид элементов
  expected-result: |
    Интерфейс приложения корректно и одинаково стабильно отображается во всех популярных браузерах, включая Safari, без наложения элементов и смещения блоков
  actual-result: |
    При тестировании кроссбраузерности в изолированной среде реального браузера Safari (через сервис Browserling) обнаружено слипание элементов внутри карточки товара. 
    Значение актуальной цены, цены со скидкой, количества товара в наличии и кнопка добавления в корзину отображаются без отступов, вплотную друг к другу.
    Ошибка изображена на скриншоте assets/bug_safari.png

- summary: |
    Основная цена и цена со скидкой идентичны в карточках товаров
  environment: |
    Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
    ОС Windows 10
  steps-to-reproduce: |
    1. Открыть сайт на первой странице каталога
    2. Пролистать до товара Cucumber и сравнить цену до скидки и после скидки
  expected-result: |
    Если у товара есть скидка, старая (зачеркнутая) цена должна быть строго выше, чем новая цена со скидкой. 
    Если скидки на товар нет, должна отображаться только одна текущая цена (без вывода зачеркнутого дубликата).
  actual-result: |
    В блоке цен отображаются 2 одинаковых числовых значения.
    Ошибка изображена на скриншоте assets/bug_zero_discount.png

- summary: |
    Длинные значения цен ломают верстку в карточках товаров для тест-кейса Проверка визуального отображения цены со скидкой
  environment: |
    Ссылка на билд/коммит/версия ПО и всего окружения
  steps-to-reproduce: |
    Полный перечень шагов для воспроизведения и описание, на каком шаге произошла ошибка
  expected-result: |
    Какой результат должен быть без ошибки
  actual-result: |
    Какой результат получился на самом деле
