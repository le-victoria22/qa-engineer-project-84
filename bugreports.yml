- summary: |
    Отсутствует кнопка сброса фильтров в блоке фильтрации товаров
  environment: |
    Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
    ОС Windows 10
  steps-to-reproduce: |
    1. Открыть сайт на первой странице каталога
    2. Применить любой параметр в левой панели фильтров, чтобы изменить текущую выдачу товаров в каталоге
    3. Визуально осмотреть панель фильтров на предмет наличия элемента управления для отмены всех фильтров (кнопка «Сбросить фильтры»)
  expected-result: |
    В левой панели фильтров визуально присутствует кнопка «Сбросить фильтры».
    После нажатия на неё все введённые значения цен, поисковое слово и выбранные бренды мгновенно очищаются, а каталог возвращается к полному списку товаров.
  actual-result: |
    Кнопка сброса фильтров отсутствует в интерфейсе. 
    Выбранные фильтры можно отменить только вручную, снимая галочки с каждого чекбокса по отдельности, либо путем полной перезагрузки страницы.
    Ошибка изображена на скриншоте assets/bug_reset_filters.png

- summary: |
    Отсутствует возможность изменения количества товара в корзине
  environment: |
    Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
    ОС Windows 10
  steps-to-reproduce: |
    1. Открыть каталог на любой странице, добавить в корзину любой товар
    2. Визуально проверить строку товара на наличие элементов управления количеством
  expected-result: |
    В корзине для каждой позиции реализован блок изменения количества (кнопки +/- или поле ввода)
