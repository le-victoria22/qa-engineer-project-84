    Ошибка изображена на скриншоте assets/bug_cart_quantity.png

- summary: |
    Ошибка 500 при отправке запроса на создание заказа
  environment: |
    Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
    ОС Windows 10
  steps-to-reproduce: |
    1. Добавить в корзину любые товары, перейти на страницу корзины
    2. Открыть панель разработчика и переключиться на вкладку Network
    3. Нажать кнопку "Checkout"
    4. При появлении всплывающего сообщения «Order placed successfully» визуально оценить состояние счётчика корзины в шапке и страницы корзины на заднем фоне
    5. Нажать кнопку «Close» внутри всплывающего сообщения
    6. Проверить финальное состояние страницы корзины и счётчика товаров
    7. Найти в панели Network заблокированный запрос orders и посмотреть вкладку Response
  expected-result: |
    На шаге 4 счётчик товаров в корзине в шапке сайта сразу сбрасывается, а список товаров на фоне очищается.
    На шаге 6 страница корзины отображается в пустом состоянии, товары в ней полностью отсутствуют.
    Сервер должен успешно обрабатывать валидные данные заказа.
  actual-result: |
    При попытке завершить оформление заказа сервер возвращает ошибку 500 (Internal Server Error) в ответ на метод POST https://products-store.hexlet.app/api/orders.
    В теле ответа сервера: "Failed to create order". 
    Корзина остается заполненной. Товары и итоговая сумма не сбрасываются.
    Ошибка изображена на скриншоте assets/bug_uncleared_cart.png и assets/bug_uncleared_cart2.png

- summary: |
    Отсутствует предупреждение пользователя при попытке закрыть вкладку с товарами в корзине
  environment: |
    Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
    ОС Windows 10
  steps-to-reproduce: |
    1. Добавить в корзину любые товары
    2. Не оформляя заказ, попытаться закрыть вкладку сайта или обновить страницу
  expected-result: |
    Вкладка не закрывается автоматически. 
    По центру или вверху экрана всплывает нативное системное окно браузера с предупреждением (например: «Возможно, внесенные изменения не сохранятся»).
    В окне присутствуют две кнопки выбора: одна для подтверждения выхода (страница закроется), вторая — для отмены действия (пользователь остается на сайте, корзина сохраняется).
  actual-result: |
    Вкладка закрывается мгновенно, без вывода предупреждающего диалогового окна. 
    Данные о неоформленном заказе могут быть утеряны.

- summary: |
    Нарушено визуальное отображение переключателя языков: отсутствует выделение активного языка и сломано изображение флага
  environment: |
    Google Chrome 156.0.8078.48 (официальная сборка) (64 бит)
    ОС Windows 10
  steps-to-reproduce: |
    1. Визуально оценить переключатель языков в шапке сайта (по дефолту активен английский язык)
    2. Нажать на кнопку переключения локализации на русский язык
    3. Визуально оценить изменения в переключателе языков после смены локализации
  expected-result: |
    На шаге 1 кнопка или иконка English имеет явное визуальное выделение относительно кнопки Russian (например: изменена заливка, текст стал жирным, появилось подчеркивание или рамка).
    На шаге 3 визуальный фокус мгновенно переходит на кнопку Russian: теперь она подсвечена как активная, а кнопка English становится блеклой / неактивной.
  actual-result: |
    Интерфейс переводится на выбранный язык, однако в самом переключателе оба языка отображаются абсолютно одинаково (оба на белом фоне). 
    Активный язык визуально не выделен (нет жирного шрифта, изменения цвета, подчеркивания или фоновой плашки).
    Вместо иконки флага English отображается стандартный браузерный значок «битого» изображения.
    Ошибка изображена на скриншоте assets/bug_language.png

